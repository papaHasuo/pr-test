<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? 'Edit task' : 'New task'">New task</title>
</head>
<body>
<h1 th:text="${editMode} ? 'Edit task' : 'Create task'">Create task</h1>
<div th:if="${errorMessage}" th:text="${errorMessage}"></div>
<form th:action="${editMode} ? @{/tasks/{taskId}/edit(taskId=${task.id})} : @{/tasks}"
      method="post">
    <label for="title">Title</label>
    <input id="title" type="text" name="title"
           th:value="${task != null ? task.title : ''}" required />
    <br/>
    <label for="description">Description</label>
    <textarea id="description" name="description"
              th:text="${task != null ? task.description : ''}"></textarea>
    <br/>
    <button type="submit" th:text="${editMode} ? 'Update' : 'Save'">Save</button>
</form>
</body>
</html>
