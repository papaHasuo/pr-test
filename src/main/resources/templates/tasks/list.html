<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tasks</title>
</head>
<body>
<h1>Task list</h1>
<a th:href="@{/tasks/new}">Create task</a>
<ul>
    <li th:each="task : ${tasks}">
        <span th:text="${task.title}">Task title</span>
        <span th:text="${task.status}">OPEN</span>
        <form th:if="${task.status.name() != 'DONE'}"
              th:action="@{/tasks/{taskId}/complete(taskId=${task.id})}"
              method="post">
            <button type="submit">Complete</button>
        </form>
    </li>
</ul>
</body>
</html>
